<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Guardian badge verify</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/theme-guardian.css?v=gf1">
<style>
  :root {
    --ink: #0b1210;
    --panel: #121a16;
    --line: #243028;
    --gold: #c9a227;
    --live: #3ddc84;
    --bad: #d96a5e;
    --text: #e7efe8;
    --dim: #8a9a90;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    min-height: 100vh;
    background:
      radial-gradient(1200px 600px at 20% -10%, rgba(61, 220, 132, 0.12), transparent 55%),
      radial-gradient(900px 500px at 90% 10%, rgba(201, 162, 39, 0.1), transparent 50%),
      linear-gradient(160deg, #0b1210 0%, #101816 45%, #0c1411 100%);
    color: var(--text);
    font: 400 16px/1.55 "IBM Plex Sans", system-ui, sans-serif;
    padding: 40px 20px 72px;
  }
  .wrap { max-width: 560px; margin: 0 auto; }
  .brand {
    font: 700 34px/1.1 "Cormorant Garamond", Georgia, serif;
    letter-spacing: -0.02em;
    color: var(--gold);
  }
  h1 {
    font: 600 22px/1.25 "Cormorant Garamond", Georgia, serif;
    margin: 18px 0 8px;
  }
  .sub { color: var(--dim); margin-bottom: 28px; }
  label { display: block; font-size: 13px; color: var(--dim); margin-bottom: 8px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  input {
    flex: 1 1 220px;
    background: var(--panel);
    border: 1px solid var(--line);
    color: var(--text);
    font: 500 15px/1.4 "IBM Plex Mono", ui-monospace, monospace;
    padding: 12px 14px;
    border-radius: 8px;
  }
  button {
    background: var(--gold);
    color: var(--ink);
    border: 0;
    font: 600 14px/1 "IBM Plex Sans", system-ui, sans-serif;
    padding: 12px 18px;
    border-radius: 8px;
    cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: default; }
  .card {
    margin-top: 28px;
    padding: 20px 0 0;
    border-top: 1px solid var(--line);
  }
  .status { font: 600 15px/1.3 "IBM Plex Sans", system-ui, sans-serif; }
  .status.ok { color: var(--live); }
  .status.bad { color: var(--bad); }
  .mono { font-family: "IBM Plex Mono", ui-monospace, monospace; word-break: break-all; }
  .meta { margin-top: 14px; color: var(--dim); font-size: 14px; }
  .meta div { margin: 6px 0; }
  .meta b { color: var(--text); font-weight: 600; }
  a { color: var(--gold); }
  .tiny { margin-top: 36px; color: var(--dim); font-size: 13px; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="brand">Guardian</div>
    <h1>Badge verify</h1>
    <p class="sub">Look up a serial issued after an eligible scan. Patterns, not verdicts.</p>

    <label for="serial">Serial</label>
    <div class="row">
      <input id="serial" name="serial" spellcheck="false" autocomplete="off" placeholder="GRD-YYYYMMDD-XXXXXXXX" />
      <button id="go" type="button">Verify</button>
    </div>

    <div class="card" id="out" hidden>
      <div class="status" id="status"></div>
      <div class="meta" id="meta"></div>
    </div>

    <p class="tiny">Phase 2 · step 1 registry. Public verify is free. Live risk still requires a fresh scan.</p>
  </div>
<script>
(function () {
  var input = document.getElementById('serial');
  var go = document.getElementById('go');
  var out = document.getElementById('out');
  var status = document.getElementById('status');
  var meta = document.getElementById('meta');

  function serialFromPath() {
    var m = location.pathname.match(/\/verify\/([^/?#]+)/i);
    return m ? decodeURIComponent(m[1]) : '';
  }

  function setBusy(busy) {
    go.disabled = busy;
    go.textContent = busy ? 'Checking…' : 'Verify';
  }

  async function verify(raw) {
    var serial = String(raw || '').trim().toUpperCase();
    if (!serial) return;
    input.value = serial;
    out.hidden = false;
    status.className = 'status';
    status.textContent = 'Looking up…';
    meta.innerHTML = '';
    setBusy(true);
    try {
      var r = await fetch('/api/badge/verify?serial=' + encodeURIComponent(serial), {
        headers: { accept: 'application/json' },
        cache: 'no-store'
      });
      var j = await r.json();
      if (!j.badge) {
        status.className = 'status bad';
        status.textContent = j.error || 'Serial not found';
        return;
      }
      var expired = Boolean(j.expired);
      status.className = 'status ' + (j.valid ? 'ok' : 'bad');
      status.textContent = j.valid ? 'Valid badge serial' : (expired ? 'Expired badge serial' : 'Invalid');
      var b = j.badge;
      meta.innerHTML =
        '<div><b>Serial</b> <span class="mono">' + b.serial + '</span></div>' +
        '<div><b>Mint</b> <span class="mono">' + b.mint + '</span></div>' +
        '<div><b>Grade</b> ' + (b.grade || '—') + (b.score != null ? ' · ' + b.score : '') + '</div>' +
        '<div><b>LP tier</b> ' + (b.lpTier || '—') + (b.lifetimeEligible ? ' · lifetime' : '') + '</div>' +
        '<div><b>Issued</b> ' + (b.issuedAt || '—') + '</div>' +
        (b.expiresAt ? '<div><b>Expires</b> ' + b.expiresAt + '</div>' : '') +
        (b.scanUrl ? '<div><a href="' + b.scanUrl + '">Open scan</a></div>' : '');
    } catch (e) {
      status.className = 'status bad';
      status.textContent = 'Verify failed';
    } finally {
      setBusy(false);
    }
  }

  go.addEventListener('click', function () { verify(input.value); });
  input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') verify(input.value);
  });

  var fromPath = serialFromPath();
  var fromQuery = new URLSearchParams(location.search).get('serial') || '';
  if (fromPath || fromQuery) verify(fromPath || fromQuery);
})();
</script>
</body>
</html>
