<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYRE Guardian - Global Synthetic Intelligence</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #000000;
            color: #c0c0c0;
            line-height: 1.6;
        }

        /* Matte Texture Overlay */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                repeating-linear-gradient(
                    90deg,
                    rgba(64, 64, 64, 0.03),
                    rgba(64, 64, 64, 0.03) 1px,
                    transparent 1px,
                    transparent 2px
                ),
                repeating-linear-gradient(
                    0deg,
                    rgba(64, 64, 64, 0.03),
                    rgba(64, 64, 64, 0.03) 1px,
                    transparent 1px,
                    transparent 2px
                );
            pointer-events: none;
            z-index: -1;
        }

        /* Navigation */
        nav {
            position: sticky;
            top: 0;
            background: rgba(0, 0, 0, 0.98);
            border-bottom: 1px solid #404040;
            padding: 1.5rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
            box-shadow: 0 2px 20px rgba(0, 0, 0, 0.5);
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 800;
            color: #c0c0c0;
            letter-spacing: -1px;
        }

        nav a {
            color: #a0a0a0;
            text-decoration: none;
            margin: 0 1.5rem;
            font-size: 0.95rem;
            transition: all 0.3s;
            font-weight: 500;
        }

        nav a:hover {
            color: #e0e0e0;
            text-shadow: 0 0 10px rgba(192, 192, 192, 0.3);
        }

        .hero {
            min-height: 90vh;
            display: flex;
            align-items: center;

            padding: 4rem 2rem;

            position: relative;
            overflow: hidden;
        }

        .hero-content {
            flex: 1;
            max-width: 600px;
            z-index: 10;
        }

        .hero h1 {
            font-size: 3.5rem;
            font-weight: 800;
            margin-bottom: 1rem;
            color: #ffffff;
            line-height: 1.2;
            letter-spacing: -1px;
        }

            color: #808080;
            margin-bottom: 2rem;
            line-height: 1.6;
        }

            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }
