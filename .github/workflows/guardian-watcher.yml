name: Guardian watcher

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  group: guardian-watcher
  cancel-in-progress: false

jobs:
  watch-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run on-chain watcher (live)
        env:
          BRIDGE_URL: ${{ secrets.BRIDGE_URL }}
          WATCHLIST: ${{ secrets.WATCHLIST }}
          RPC: ${{ secrets.SOLANA_RPC }}
          INTERVAL_MIN: '15'
          DRY_RUN: 'false'
        run: node watcher.js
